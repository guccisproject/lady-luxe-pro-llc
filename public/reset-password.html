<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | Lady Katt Luxe</title>
<meta name="description" content="Reset the password for your Lady Katt Luxe account.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070708">
<meta property="og:site_name" content="Lady Katt Luxe">
<meta property="og:title" content="Reset Password | Lady Katt Luxe">
<meta property="og:description" content="Reset the password for your Lady Katt Luxe account.">
<meta property="og:type" content="website">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/main.js" defer></script>
</head>
<body data-page="reset">
<main id="main">
<section class="wrap section">
  <div class="glass glass-pad reveal auth-narrow">
    <div id="reset-request">
      <span class="eyebrow">Forgot password</span>
      <h1 style="font-size:clamp(2rem,4.5vw,3rem)">Reset your password</h1>
      <p>Enter the email you use for your account and we&rsquo;ll send you a link to choose a new password.</p>
      <form id="forgot-form" class="auth-form" novalidate>
        <div><label for="fg-email">Email</label><input id="fg-email" name="email" type="email" autocomplete="email" required maxlength="200"></div>
        <button class="btn btn-block" type="submit">Send reset link</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div id="reset-set" hidden>
      <span class="eyebrow">New password</span>
      <h1 style="font-size:clamp(2rem,4.5vw,3rem)">Choose a new password</h1>
      <form id="reset-form" class="auth-form" novalidate>
        <div><label for="rs-password">New password <span class="muted" style="letter-spacing:.1em;text-transform:none">(at least 8 characters)</span></label><input id="rs-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200"></div>
        <button class="btn btn-block" type="submit">Save new password</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
    <p class="center" style="margin:22px 0 0"><a class="link-arrow" href="login.html">Back to sign in</a></p>
  </div>
</section>
</main>
<noscript><div class="wrap"><p class="glass glass-pad center" style="margin-top:24px">Please enable JavaScript to use your shopping bag and checkout. You can also order by emailing <a href="mailto:contact@ladykattluxe.shop">contact@ladykattluxe.shop</a> or calling 904-663-2417.</p></div></noscript>
</body>
</html>
