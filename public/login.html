<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In | Lady Katt Luxe</title>
<meta name="description" content="Sign in to your Lady Katt Luxe account or create a new one.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070708">
<meta property="og:site_name" content="Lady Katt Luxe">
<meta property="og:title" content="Sign In | Lady Katt Luxe">
<meta property="og:description" content="Sign in to your Lady Katt Luxe account or create a new one.">
<meta property="og:type" content="website">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/main.js" defer></script>
</head>
<body data-page="login">
<main id="main">
<section class="wrap section-tight">
  <div class="glass page-hero reveal" style="padding-bottom:clamp(28px,5vw,56px)">
    <span class="eyebrow">Your account</span>
    <h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">Welcome</h1>
    <p class="lead">Sign in to see your orders and check out faster, or create an account in a moment.</p>
  </div>
</section>

<section class="wrap section-tight">
  <div class="grid grid-2 auth-grid">
    <div class="glass glass-pad reveal">
      <h2 style="font-size:1.9rem">Sign in</h2>
      <form id="login-form" class="auth-form" novalidate>
        <div><label for="li-email">Email</label><input id="li-email" name="email" type="email" autocomplete="email" required maxlength="200"></div>
        <div><label for="li-password">Password</label><input id="li-password" name="password" type="password" autocomplete="current-password" required maxlength="200"></div>
        <button class="btn btn-block" type="submit">Sign in</button>
        <p class="form-status" role="status" aria-live="polite"></p>
        <p class="center" style="margin:0"><a class="link-arrow" href="reset-password.html">Forgot your password?</a></p>
      </form>
    </div>

    <div class="glass glass-pad reveal">
      <h2 style="font-size:1.9rem">Create an account</h2>
      <form id="register-form" class="auth-form" novalidate>
        <div><label for="rg-name">Name</label><input id="rg-name" name="name" type="text" autocomplete="name" required maxlength="120"></div>
        <div><label for="rg-email">Email</label><input id="rg-email" name="email" type="email" autocomplete="email" required maxlength="200"></div>
        <div><label for="rg-password">Password <span class="muted" style="letter-spacing:.1em;text-transform:none">(at least 8 characters)</span></label><input id="rg-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200"></div>
        <button class="btn btn-ghost btn-block" type="submit">Create account</button>
        <p class="form-status" role="status" aria-live="polite"></p>
        <p class="muted" style="font-size:.8rem;margin:0">By creating an account you agree to our <a href="terms.html" style="border-bottom:1px solid var(--line)">Terms &amp; Conditions</a> and <a href="privacy.html" style="border-bottom:1px solid var(--line)">Privacy Policy</a>.</p>
      </form>
    </div>
  </div>
</section>
</main>
<noscript><div class="wrap"><p class="glass glass-pad center" style="margin-top:24px">Please enable JavaScript to use your shopping bag and checkout. You can also order by emailing <a href="mailto:contact@ladykattluxe.shop">contact@ladykattluxe.shop</a> or calling 904-663-2417.</p></div></noscript>
</body>
</html>
